# SYNTHETIC research-import example for TimelineXray.
#
# Every finding below is invented for testing. The code sources point at the synthetic
# fixture repository of the test suite (tests/support.py, commit 3879192e...), not at any
# real upstream code, and the web sources use reserved example domains. Import it with:
#
#   txray findings import schemas/research-import.example.yaml --source-label EXAMPLE --actor importer
#
# The format is described by schemas/research-import.schema.json.
findings:
