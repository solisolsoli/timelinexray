    path: src/lib.rs
    lines: 1-1
    commit: 3879192e944aed5a4e98d662ceee2a497b6e02a4
    anchor: 'pub const CLICK: f64'
  creator_relevance: low
  creator_controllable: 'no'
  implication: Synthetic example only; it says nothing about any real system.
  volatility: param
  misuse_risk: low
